name: Health Vault MCP checks
on:
  pull_request:
    paths:
      - 'packages/health-vault-mcp/**'
      - 'supabase/functions/health-vault-mcp/**'
      - 'supabase/functions/share/**'
      - 'scripts/check-health-vault-*.mjs'
      - '.github/workflows/health-vault-mcp-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test packages/health-vault-mcp/src/*.test.ts
      - run: git diff --check

  edge-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - run: node scripts/check-health-vault-edge.mjs
