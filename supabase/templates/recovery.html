<!DOCTYPE html>
<html>
  <body style="margin:0;background:#f4f6fb;font-family:Arial,Helvetica,sans-serif;color:#1e293b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:32px;">
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <img src="https://healthvault.me/hv_logo-light.png" alt="Health Vault" width="64" height="64" style="display:block;border:0;" />
              </td>
            </tr>
            <tr>
              <td align="center" style="font-size:24px;font-weight:700;color:#0f172a;padding-bottom:8px;">Reset your password</td>
            </tr>
            <tr>
              <td align="center" style="font-size:15px;line-height:22px;color:#475569;padding-bottom:24px;">
                We received a request to reset the password for your Health Vault account.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#4F46E5;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:8px;">Reset password</a>
              </td>
            </tr>
            <tr>
              <td align="center" style="font-size:13px;line-height:20px;color:#64748b;">
                If you did not request this, you can ignore this email. Your password will stay the same.
              </td>
            </tr>
          </table>
          <p style="font-size:12px;line-height:18px;color:#94a3b8;margin:16px 0 0;">Health Vault · healthvault.me</p>
        </td>
      </tr>
    </table>
  </body>
</html>
